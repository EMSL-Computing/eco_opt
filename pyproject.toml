[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eco_opt"
version = "0.1.0"
description = "Python reimplementation of the MATLAB Yop optimal-control package, built on CasADi."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
dependencies = [
    "casadi>=3.6",
    "numpy>=1.20",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
