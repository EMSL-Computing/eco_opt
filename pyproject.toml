[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eco_opt"
version = "0.1.0"
description = "Optimal control for process-based models (CasADi). Python implementation of the Yop modelling workflow."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
dependencies = [
    "casadi>=3.6",
    "numpy>=1.20",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
docs = ["mkdocs>=1.5,<2", "mkdocs-material>=9", "pymdown-extensions>=10"]

[tool.setuptools.packages.find]
where = ["src"]
